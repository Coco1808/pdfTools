name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pack project
        run: |
          tar -czf /tmp/pdf-tools.tgz \
            --exclude='.git' \
            --exclude='./.git' \
            --exclude='web/node_modules' \
            --exclude='server/.venv' \
            --exclude='server/temp' \
            .
          mv /tmp/pdf-tools.tgz "${GITHUB_WORKSPACE}/pdf-tools.tgz"

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: pdf-tools.tgz
          target: /tmp
          overwrite: true
          timeout: 120s

      - name: Build and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR=/home/admin/pdf-tools
            fi
            mkdir -p "$DEPLOY_DIR"
            tar -xzf /tmp/pdf-tools.tgz -C "$DEPLOY_DIR"
            rm -f /tmp/pdf-tools.tgz
            cd "$DEPLOY_DIR"
            run_compose() {
              docker compose up -d --build
              docker compose ps
            }
            if docker info >/dev/null 2>&1; then
              run_compose
            elif sg docker -c "docker info" >/dev/null 2>&1; then
              sg docker -c "docker compose up -d --build && docker compose ps"
            elif sudo -n docker info >/dev/null 2>&1; then
              sudo docker compose up -d --build
              sudo docker compose ps
            else
              echo "admin 无法使用 Docker。在服务器执行后重新部署："
              echo "  sudo usermod -aG docker admin"
              echo "然后退出 SSH 再登录，执行 docker ps 确认。"
              id
              ls -l /var/run/docker.sock || true
              exit 1
            fi
